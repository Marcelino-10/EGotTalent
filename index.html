<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E3dadi Got Talent</title>
  </head>
  <body>
    <h1>E3dadi Got Talent</h1>
    <div>
      <input type="text" id="name" placeholder="Enter your name" />
    </div>
    <div>
      <input
        type="number"
        id="score"
        min="0"
        max="10"
        placeholder="Enter score from 1-10"
      />
    </div>
    <div>
      <button id="submit">Submit</button>
    </div>

    <h2>Final Score: <span id="finalScore">-</span></h2>
    <h3>Recent Submissions</h3>
    <ul id="submissions"></ul>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap");

      body {
        font-family: "Poppins", sans-serif;
        background: radial-gradient(circle at top, #1b0034 0%, #090018 100%);
        color: #fff;
        text-align: center;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 60px;
      }

      /* Title Styling */
      h1 {
        font-size: 2.8rem;
        background: linear-gradient(90deg, #ff007c, #ffa400);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(255, 0, 120, 0.6);
        margin-bottom: 30px;
        animation: glow 3s ease-in-out infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 20px rgba(255, 0, 120, 0.6);
        }
        to {
          text-shadow: 0 0 40px rgba(255, 164, 0, 1);
        }
      }

      /* Input Containers */
      div {
        margin: 15px 0;
      }

      input {
        width: 250px;
        padding: 10px 15px;
        font-size: 1rem;
        border: none;
        border-radius: 25px;
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        transition: 0.3s;
      }

      input::placeholder {
        color: #ddd;
      }

      input:focus {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 15px #ff007c;
      }

      /* Button Styling */
      button {
        background: linear-gradient(90deg, #ff007c, #ffa400);
        color: #fff;
        border: none;
        border-radius: 30px;
        padding: 12px 25px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.3s ease;
        box-shadow: 0 0 15px rgba(255, 0, 120, 0.6);
      }

      button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 25px rgba(255, 164, 0, 1);
      }

      /* Final Score Section */
      h2 {
        margin-top: 40px;
        font-size: 1.8rem;
        text-shadow: 0 0 10px #ffa400;
      }

      #finalScore {
        color: #ffa400;
        font-weight: 700;
        font-size: 2rem;
      }

      /* Submissions List */
      h3 {
        margin-top: 40px;
        text-decoration: underline;
        color: #ffb3e6;
      }

      ul {
        list-style: none;
        padding: 0;
        width: 60%;
        max-width: 500px;
        margin: 20px auto;
      }

      ul li {
        background: rgba(255, 255, 255, 0.1);
        margin: 10px 0;
        padding: 10px 15px;
        border-radius: 10px;
        font-weight: 500;
        display: flex;
        justify-content: space-between;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        transition: transform 0.2s ease, background 0.3s ease;
      }

      ul li:hover {
        transform: scale(1.02);
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
    <script src="script.js"></script>
  </body>
</html>
